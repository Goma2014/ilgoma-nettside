name: Hent bilder fra gammel side
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/bilder.txt
      - scripts/hent-bilder.sh
      - .github/workflows/hent-bilder.yml
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/hent-bilder.sh
      - name: Lagre nye bilder i repoet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bilder
          git diff --cached --quiet || (git commit -m "Hent bilder fra gamle ilgoma.no" && git push)
